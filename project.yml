# XcodeGen spec — the source of truth for Gaca.xcodeproj.
# Regenerate after adding/removing files or changing settings:
#   xcodegen generate
name: Gaca
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1

targets:
  Gaca:
    type: application
    platform: iOS
    sources:
      - path: Gaca
    dependencies:
      - package: MarkdownUI
    info:
      path: Gaca/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gaca
        UILaunchScreen:
          UIColorName: PageBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        # YES only when signed with Push.entitlements (Config/*.xcconfig).
        GacaPushEnabled: $(GACA_PUSH_ENABLED)
        # gaca://setup?url=…&code=… (what `gaca-api pair` prints), gaca://artifact/<id>, …
        CFBundleURLTypes:
          - CFBundleURLName: gaca
            CFBundleURLSchemes:
              - gaca
        NSCameraUsageDescription: Scan the QR code your GACA server shows to pair this iPhone with it.
        # Lets Settings point at a dev box on the LAN (plain http) — public internet
        # traffic still has to be https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Signing team, bundle id and entitlements come from Config/*.xcconfig, so each
    # person can set their own in Config/Local.xcconfig (see the README).
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig

  GacaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GacaTests
    dependencies:
      - target: Gaca
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.monts.gaca.tests

  GacaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GacaUITests
    dependencies:
      - target: Gaca
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.monts.gaca.uitests
        TEST_TARGET_NAME: Gaca

schemes:
  Gaca:
    build:
      targets:
        Gaca: all
        GacaTests: [test]
        GacaUITests: [test]
    test:
      targets:
        - GacaTests
        - GacaUITests
