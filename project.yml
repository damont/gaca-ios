# XcodeGen spec — the source of truth for Gaca.xcodeproj.
# Regenerate after adding/removing files or changing settings:
#   xcodegen generate
name: Gaca
options:
  bundleIdPrefix: dev.monts
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team here (or in Xcode › Signing & Capabilities)
    # to run on a real device. Simulator builds don't need it.
    DEVELOPMENT_TEAM: ""

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 8.0.0

targets:
  Gaca:
    type: application
    platform: iOS
    sources:
      - path: Gaca
    dependencies:
      - package: MarkdownUI
      - package: GoogleSignIn
        product: GoogleSignIn
    entitlements:
      path: Gaca/Resources/Gaca.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Gaca/Resources/Info.plist
      properties:
        CFBundleDisplayName: Gaca
        UILaunchScreen:
          UIColorName: PageBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        # Google sign-in: the iOS OAuth client id from Google Cloud console, and its
        # reversed form as a URL scheme. Leave GIDClientID empty to hide the button.
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: google-signin
            CFBundleURLSchemes:
              - $(GOOGLE_IOS_REVERSED_CLIENT_ID)
          - CFBundleURLName: gaca
            CFBundleURLSchemes:
              - gaca
        GacaDefaultAPIBase: $(GACA_DEFAULT_API_BASE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.monts.gaca
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
      configFiles:
        Debug: Config/Debug.xcconfig
        Release: Config/Release.xcconfig

  GacaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GacaTests
    dependencies:
      - target: Gaca
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.monts.gaca.tests

schemes:
  Gaca:
    build:
      targets:
        Gaca: all
        GacaTests: [test]
    test:
      targets:
        - GacaTests
